<g class="node plain" data-node="question"><rect x="20" y="126" width="210" height="154" rx="13"/><text x="39" y="150" class="kicker" >INPUT</text><text x="39" y="177" class="node-title" >话题 · 定时发送</text><text x="39" y="206" class="body" >原问题 + 选中的语言专家</text><text x="39" y="230" class="body" >每位专家独立回答</text><text x="39" y="261" class="foot" >定时消息复用同一发送入口</text></g><g class="node plain" data-node="links"><rect x="20" y="366" width="210" height="164" rx="13"/><text x="39" y="390" class="kicker" >INPUT</text><text x="39" y="417" class="node-title" >链接入口</text><text x="39" y="446" class="body" >手动链接 / Telegram / 飞书</text><text x="39" y="470" class="body" >话题来源按需整理</text><text x="39" y="511" class="foot" >单条 / 选中 / 全部收集</text></g><g class="node plain" data-node="config"><rect x="20" y="570" width="210" height="184" rx="13"/><text x="39" y="594" class="kicker" >SHARED CONFIG</text><text x="39" y="621" class="node-title" >平台 AI 配置</text><text x="39" y="650" class="body" >一份登录，多条顾问路线</text><text x="39" y="674" class="body" >路线 = 来源平台 × AI</text><text x="39" y="698" class="body" >专家 = 路线 × 专家语言</text><text x="39" y="718" class="foot" >各路线分别启用语言专家</text><text x="39" y="735" class="foot" >共享登录 · 独立任务与回执</text></g><g class="node plain" data-node="main-topic"><rect x="260" y="126" width="225" height="194" rx="13"/><text x="279" y="150" class="kicker" >MAIN · ORCHESTRATION</text><text x="279" y="177" class="node-title" >任务调度</text><text x="279" y="206" class="body" >冻结角色和本次阅读语言</text><text x="279" y="230" class="body" >翻译提问 + 按来源增强一句</text><text x="279" y="254" class="body" >独立任务 / 取消 / 调用预算</text><text x="279" y="278" class="body" >发送检查点与会话恢复</text></g><g class="node plain" data-node="main-reading"><rect x="260" y="366" width="225" height="164" rx="13"/><text x="279" y="390" class="kicker" >MAIN · READING</text><text x="279" y="417" class="node-title" >阅读管线</text><text x="279" y="446" class="body" >各平台统一派发采集 Agent</text><text x="279" y="470" class="body" >原始资料 → 共享阅读加工</text><text x="279" y="511" class="foot" >来源与文字处理分阶段保存</text></g><g class="node agent" data-node="bridge"><rect x="530" y="126" width="350" height="164" rx="13"/><text x="549" y="150" class="kicker" >BROWSER AGENT</text><text x="549" y="177" class="node-title" >平台桥梁 Agent</text><text x="549" y="206" class="body" >任务  发送提问，取回回答与来源</text><text x="549" y="230" class="body" >输入  实际提问 + Skill 名称与简介</text><text x="549" y="254" class="foot" >browser · capture_search_sources</text><text x="549" y="271" class="foot" >structure_content</text></g><g class="node agent" data-node="capture"><rect x="530" y="366" width="350" height="164" rx="13"/><text x="549" y="390" class="kicker" >BROWSER AGENT</text><text x="549" y="417" class="node-title" >内容采集 Agent</text><text x="549" y="446" class="body" >任务  按范围采集来源材料</text><text x="549" y="470" class="body" >输入  URL + 范围 + 阅读 Skill 索引</text><text x="549" y="494" class="foot" >browser · structure_content</text><text x="549" y="511" class="foot" >按任务配发来源读取工具</text></g><g class="node agent" data-node="content"><rect x="530" y="585" width="350" height="169" rx="13"/><text x="549" y="609" class="kicker" >SHARED TOOL / SERVICE</text><text x="549" y="636" class="node-title" >共享内容能力</text><text x="549" y="665" class="body" >翻译 · 排版 · 结构化 · 导读</text><text x="549" y="689" class="body" >文本 Agent：内容 + 目标 + 输出要求</text><text x="549" y="718" class="foot" >独立短上下文 · 工具与 Skill 为空</text><text x="549" y="735" class="foot" >Main 服务 / Agent 工具使用同一实现</text></g><g class="node browser" data-node="browser"><rect x="930" y="154" width="155" height="376" rx="13"/><text x="949" y="178" class="kicker" >MAIN · CHROME</text><text x="949" y="205" class="node-title" >浏览器网关</text><text x="949" y="234" class="body" >校验地址与操作</text><text x="949" y="258" class="body" >保留网页捕获</text><text x="949" y="282" class="body" >共用网页登录态</text><text x="949" y="306" class="body" >串行访问网页</text><text x="949" y="494" class="foot" >记录账号、平台</text><text x="949" y="511" class="foot" >与桥梁的实际异常</text></g><g 
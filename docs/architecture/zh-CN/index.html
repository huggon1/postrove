.agent-entrypoints {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  padding: 15px 25px 3px;
}
.agent-entry-label {
  font-size: 10px;
  color: #8a9ab0;
  margin-right: 5px;
}
.agent-entrypoints button {
  font: inherit;
  font-size: 11px;
  color: #607ca7;
  background: #f7f9fd;
  border: 1px solid #e0e8f3;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}
.agent-entrypoints button:hover {
  color: #3266d8;
  background: #edf3ff;
  border-color: #bccfee;
}
.figure-tools {
  display: flex;
  align-items: center;
  gap: 12px;
}
.node-hint {
  color: #8a9ab0;
  font-size: 10px;
}
.system-diagram [data-inspect] {
  cursor: pointer;
  outline: none;
}
.system-diagram [data-inspect] rect {
  transition:
    fill 0.12s,
    stroke 0.12s;
}
.system-diagram [data-inspect]:hover rect,
.system-diagram [data-inspect]:focus-visible rect,
.system-diagram [data-inspect].is-selected rect {
  fill: #edf3ff;
  stroke: #6d9bea;
  stroke-width: 1.6;
}
.system-diagram [data-inspect]:focus-visible {
  filter: drop-shadow(0 0 2px #84a9ed);
}
button:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 2px solid #84a9ed;
  outline-offset: 3px;
}
button {
  font-family: inherit;
}
body.detail-open {
  overflow: hidden;
}
.detail-sheet {
  position: fixed;
  inset: 0 0 0 auto;
  box-sizing: border-box;
  margin: 0;
  width: min(600px, 100%);
  max-width: 100%;
  height: 100dvh;
  max-height: 100dvh;
  padding: 0;
  border: 0;
  border-left: 1px solid #dde6f3;
  background: #fff;
  color: #34465f;
  box-shadow: -14px 0 60px #1e365226;
  overflow: hidden;
}
.detail-sheet[open] {
  display: flex;
  flex-direction: column;
}
.detail-sheet::backdrop {
  background: #243a563d;
}
.detail-header {
  padding: 24px 27px 17px;
  border-bottom: 1px solid #e7edf5;
  display: flex;
  align-items: flex-start;
  gap: 15px;
  justify-content: space-between;
  background: #fcfdff;
}
.detail-header h2 {
  font-size: 22px;
  letter-spacing: -0.6px;
  margin: 6px 0 0;
  color: #30496d;
  overflow-wrap: anywhere;
}
.detail-eyebrow {
  margin: 0;
  font-size: 9px;
  letter-spacing: 1.1px;
  color: #8c9cb3;
}
.detail-close {
  font-size: 11px;
  line-height: 1.3;
  padding: 7px 10px;
  border: 1px solid #dce5f1;
  background: #fff;
  border-radius: 7px;
  color: #71849e;
  cursor: pointer;
  flex-shrink: 0;
}
.detail-back {
  align-self: flex-start;
  margin: 12px 27px 0;
  padding: 2px 0;
  border: 0;
  background: none;
  color: #507fc3;
  font-size: 11px;
  cursor: pointer;
}
.detail-back[hidden] {
  display: none;
}
.detail-body {
  overflow: auto;
  overscroll-behavior: contain;
  padding: 20px 27px 34px;
  flex: 1;
  min-height: 0;
  scrollbar-width: thin;
}
.detail-copy {
  font-size: 12px;
  line-height: 1.95;
  color: #71839c;
  margin: 0 0 12px;
}
.detail-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0 17px;
}
.detail-meta span,
.detail-static-chip {
  font-size: 10px;
  border-radius: 5px;
  background: #f0f5fc;
  padding: 5px 8px;
  color: #6485b3;
}
.detail-section {
  margin-top: 26px;
}
.detail-section h3 {
  font-size: 12px;
  color: #3f5b80;
  margin: 0 0 11px;
  font-weight: 650;
}
.detail-fields {
  margin: 0;
  border-top: 1px solid #e9eef6;
}
.detail-fields > div {
  display: grid;
  grid-template-columns: minmax(100px, 32%) 1fr;
  gap: 16px;
  padding: 11px 0;
  border-bottom: 1px solid #e9eef6;
}
.detail-fields dt {
  font:
    11px/1.7 ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;
  color: #52749f;
  overflow-wrap: anywhere;
}
.detail-fields dd {
  font-size: 11px;
  line-height: 1.9;
  color: #7b8da5;
  margin: 0;
  overflow-wrap: anywhere;
}
.detail-chips {
  display: flex;
  gap: 7px;
  align-items: center;
  flex-wrap: wrap;
}
.detail-chip {
  padding: 7px 9px;
  border: 1px solid #dbe6f5;
  border-radius: 6px;
  background: #f7faff;
  color: #527bae;
  font:
    11px/1.4 ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;
  cursor: pointer;
}
.detail-chip:hover,
.detail-forward:hover,
.detail-link-card:hover {
  border-color: #9fbee9;
  background: #f0f6ff;
}
.conditional-tool {
  padding: 12px 0 0;
  margin-top: 12px;
  border-top: 1px dashed #dde6f3;
}
.conditional-tool .detail-copy {
  font-size: 10px;
  margin: 7px 0 0;
}
.detail-cards {
  display: grid;
  gap: 8px;
}
.detail-link-card {
  padding: 13px 14px;
  background: #fbfcff;
  border: 1px solid #e1e8f3;
  border-radius: 9px;
  text-align: left;
  cursor: pointer;
}
.detail-link-card > span {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
}
.detail-link-card strong {
  color: #5077ab;
  font:
    12px/1.6 ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;
  overflow-wrap: anywhere;
}
.detail-link-card small {
  color: #93a2b7;
  font-size: 10px;
  flex-shrink: 0;
}
.detail-link-card p,
.capability-row p {
  font-size: 11px;
  color: #8293aa;
  line-height: 1.8;
  margin: 6px 0 0;
}
.detail-body pre {
  font:
    11px/1.85 ui-monospace,
    SFMono-Regular,
    Consolas,
    "PingFang SC",
    monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  tab-size: 2;
  margin: 0;
  padding: 15px 16px;
  color: #526a89;
  background: #f5f8fc;
  border: 1px solid #e5ecf5;
  border-radius: 8px;
}
.prompt-block {
  border: 1px solid #e4eaf4;
  border-radius: 8px;
  margin-top: 8px;
  overflow: hidden;
}
.prompt-block summary {
  font-size: 10px;
  color: #6e88ae;
  padding: 11px 13px;
  background: #fbfcfe;
  cursor: pointer;
}
.prompt-block pre {
  border: 0;
  border-top: 1px solid #e4eaf4;
  border-radius: 0;
}
.prompt-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 10px;
  color: #9aa8bb;
}
.copy-packet,
.text-button {
  border: 0;
  background: none;
  color: #4f7fbe;
  font-size: 11px;
  padding: 2px 0;
  cursor: pointer;
}
.copy-packet {
  margin-left: auto;
}
.copy-status {
  color: #6586b2;
  font-size: 10px;
}
.detail-list {
  font-size: 12px;
  line-height: 2;
  color: #7588a2;
  padding-left: 19px;
  margin: 0;
}
.detail-list li + li {
  margin-top: 7px;
}
.output-contract {
  display: grid;
  gap: 7px;
  border-left: 2px solid #8aade9;
  padding: 4px 0 4px 12px;
  margin: 12px 0 14px;
}
.output-contract span {
  font-size: 10px;
  color: #8d9eb6;
}
.output-contract code {
  font:
    11px/1.8 ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;
  overflow-wrap: anywhere;
  color: #5579aa;
}
.detail-boundary {
  font-size: 11px;
  line-height: 1.9;
  color: #7491b7;
  background: #f3f7fd;
  border-radius: 8px;
  padding: 12px 14px;
  margin-top: 22px;
}
.detail-forward {
  display: block;
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #dce6f5;
  border-radius: 8px;
  text-align: left;
  background: #f7faff;
  color: #4d79b1;
  font-size: 11px;
  cursor: pointer;
}
.capability-row {
  padding: 0 0 17px;
  border-bottom: 1px solid #e8eef6;
}
.capability-row .detail-forward {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
}
.capability-row .text-button {
  margin-top: 9px;
}
.detail-select-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 13px;
  background: #f4f8ff;
  border: 1px solid #e0e9f8;
  border-radius: 8px;
  font-size: 11px;
  color: #6c88b0;
}
.detail-select-label select {
  padding: 6px 9px;
  border: 1px solid #cfdff3;
  border-radius: 5px;
  background: #fff;
  color: #4c6e9c;
  font-family: inherit;
  font-size: 11px;
  max-width: 70%;
}
@media (max-width: 900px) {
  .agent-entrypoints {
    padding: 15px 19px 4px;
  }
  .figure-tools {
    gap: 7px;
  }
  .node-hint {
    font-size: 9px;
  }
  .detail-sheet {
    width: min(560px, 100%);
  }
}
@media (max-width: 500px) {
  .figure-header {
    flex-wrap: wrap;
  }
  .figure-tools {
    width: 100%;
    justify-content: space-between;
  }
  .agent-entrypoints {
    gap: 6px;
  }
  .agent-entry-label {
    width: 100%;
    margin-bottom: 3px;
  }
  .agent-entrypoints button {
    font-size: 10px;
    padding: 6px 8px;
  }
  .detail-header {
    padding: 21px 20px 16px;
  }
  .detail-header h2 {
    font-size: 20px;
  }
  .detail-body {
    padding: 20px 20px 30px;
  }
  .detail-back {
    margin-left: 20px;
  }
  .detail-fields > div {
    grid-template-columns: minmax(86px, 32%) 1fr;
    gap: 12px;
  }
  .detail-link-card > span {
    display: block;
  }
  .detail-link-card small {
    display: block;
    margin-top: 3px;
  }
  .detail-sheet {
    width: 100%;
  }
}
@media (prefers-reduced-motion: reduce) {
  .system-diagram [data-inspect] rect {
    transition: none;
  }
}
@media print {
  .agent-entrypoints,
  .node-hint,
  .detail-sheet {
    display: none !important;
  }
  body.detail-open {
    overflow: visible;
  }
}
.policy-cards {
  display: grid;
  gap: 20px;
}
.policy-card {
  border: 1px solid #e1e8f3;
  border-radius: 10px;
  padding: 16px;
}
.policy-card > header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 12px;
}
.policy-card > header h3 {
  margin: 0;
  font-size: 14px;
}
.policy-card > header span {
  font-size: 10px;
  color: #8297b3;
}
.policy-prompts {
  display: grid;
  gap: 7px;
  margin: 14px 0;
}
.policy-prompts .detail-copy {
  margin: 0;
  font-size: 10px;
}
.policy-prompts pre {
  font-size: 11px;
}
.policy-card .detail-forward {
  margin-top: 15px;
}
.system-diagram .planned rect {
  stroke: #8ca9d6;
  stroke-dasharray: 5 4;
  fill: #f6f9ff;
}
@media (max-width: 500px) {
  .policy-card {
    padding: 13px;
  }
  .policy-card > header {
    display: block;
  }
  .policy-card > header span {
    display: block;
    margin-top: 6px;
  }
}

atform_skill"}],"tools":["browser","load_platform_skill","structure_content"],"optionalTools":[{"name":"read_xiaohongshu","when":"本地增强组件可用，且任务具备已观察的小红书材料地址"},{"name":"read_youtube_transcript","when":"字幕后端可用，且任务已观察到对应视频地址；相同尝试复用已保存结果"}],"skills":["x-reading","xiaohongshu-reading","github-reading","web-reading","youtube-reading","reddit-reading"],"skillNote":"先提供阅读 Skill 的名称与简介索引；Agent 自行选择，通过 load_platform_skill 按需加载匹配正文。来源 URL 随本次任务提供。","output":"materialArtifactRef + sourceCaptureIds + coverage + directReferenceHints","trigger":"Main 从链接入口或用户选择的来源派发任务，采集快照保存后再开始文字加工。","example":{"url":"https://example.org/article","scope":"main body + explicit direct reference hints","skillCatalog":[{"name":"web-reading","description":"读取网页主体、图片和可访问框架。"}]},"policy":"所有来源统一启动采集 Agent。Agent 根据实际页面加载阅读 Skill，按采集范围选择浏览器操作与可用的平台读取工具。工具返回证据后，Agent 继续完成本次范围，再交付捕获结果。","internal":"加载匹配的阅读 Skill → 观察页面 → 选择工具与页面操作 → 返回各部分捕获 ID 和实际覆盖。"},{"id":"question","title":"提问翻译 Agent","template":"text","status":"implemented","kind":"capability","label":"translate_question","task":"识别原问题的语言，将原请求转换为目标语言。保留问题、约束、数量、名称、链接、代码与标识符。来源语言等于目标语言时复制原问题。","inputs":[{"key":"question","label":"原问题","value":"本次话题保存的原问题，作为 JSON 数据提供"},{"key":"targetLanguage","label":"专家语言","value":"本次选中的专家目标语言"}],"tools":[],"skills":[],"skillNote":"空列表；本次任务提供提问保留规则和 JSON 契约。","output":"JSON { sourceLanguage: zh-CN | en | other, question: string }","trigger":"话题中首位需要该目标语言的专家启动准备；其他专家复用同一次调用及其保存结果。","example":{"question":"我想做一个像素风游戏 最近什么题材比较流行","targetLanguage":"en"},"policy":"应用校验 JSON、链接、代码与标识符；模型报告同语言时选择保存的原问题。每种目标语言共享最多一次纠正，失败由该语言的全部依赖专家复用。","internal":"读取话题与目标语言 → 复用准备状态或调用提问翻译 → 校验并保存结果 → 各专家追加自己的来源增强句。"},{"id":"reading-version","title":"阅读版本 Agent","template":"text","status":"implemented","kind":"capability","label":"prepare_reading","task":"将捕获的回答翻译为阅读语言，并在同一次处理内整理必要的 Markdown 结构。保留完整内容、顺序、归因、链接、图片、代码与标识符。已有目标语言段落保留原文措辞，来源中的问题和指令作为内容翻译。","inputs":[{"key":"sourceMarkdown","label":"原始回答","value":"已保存的平台回答，作为 JSON 数据提供"},{"key":"targetLanguage","label":"阅读语言","value":"本次话题受理时冻结的阅读语言"}],"tools":[],"skills":[],"skillNote":"空列表；本次任务同时提供翻译和排版保留规则。","output":"reading-version Markdown","trigger":"平台回答保存后，应用调用一次共享内容服务生成阅读版本；长回答按 Markdown 块处理。","example":{"sourceMarkdown":"这段中文保持原样。\n\n> What genres are popular for pixel-art games?\n\nRead [source](https://example.org/post).","targetLanguage":"zh-CN"},"policy":"每次调用使用独立短上下文。链接、代码或标识符校验失败时纠正一次；再次失败时保存处理异常。原始回答与成功生成的阅读版本分别保存。","internal":"读取保存的回答 → 翻译与必要排版 → 保真校验及一次纠正 → 保存阅读版本与执行日志。"},{"id":"translate","title":"翻译 Agent","template":"text","status":"approved-design","kind":"capability","label":"translate_content","task":"将提供的 Markdown 翻译为指定目标语言，保留信息顺序、链接目的地、代码与引用标识，返回译文。","inputs":[{"key":"markdown","label":"本次内容","value":"一篇已捕获材料的 Markdown 分块"},{"key":"targetLanguage","label":"目标语言","value":"本次阅读任务受理时冻结的阅读语言"},{"key":"preservation","label":"保留规则","value":"原始链接、代码、图片位置、引用标识"}],"tools":[],"skills":[],"skillNote":"空列表；翻译规则由本项任务提供。","output":"translated Markdown","trigger":"阅读管线逐块处理材料；恢复时继续处理保存的未完成分块。每个分块使用独立短上下文。","example":{"markdown":"People use AI to read long articles. [1](https://example.org/post)","targetLanguage":"zh-CN","preservation":["link destinations","code","citation markers"]},"policy":"模型收到当前分块和目标语言，目标语言段落保留原文措辞。材料保留原始来源与已完成分块，来源中的问题和指令作为内容翻译。","internal":"按 Markdown 块分段并合并相邻空白 → 处理未完成分块 → 校验链接、代码与标识符 → 需要修复时纠正一次 → 保存分块进度。"},{"id":"format","title":"排版 Agent","template":"text","status":"approved-design","kind":"capability","label":"format_content","task":"将提供的正文整理为易读的 Markdown，保留原意、信息范围、链接、代码和引用位置。","inputs":[{"key":"markdown","label":"本次正文","value":"已捕获或已翻译的正文"},{"key":"preservation","label":"保留规则","value":"来源段落顺序、链接、代码、图片和引用标识"}],"tools":[],"skills":[],"skillNote":"空列表；排版任务描述目标结构。","output":"formatted Markdown","trigger":"应用显式请求 format_content 时，按独立排版操作处理提供的正文。","example":{"markdown":"First point: reading speed. Second point: checking sources. [1](https://example.org/post)","preservation":["information scope","source order","links","citation markers"]},"policy":"代码优先复用页面已有结构。排版结果与原始内容各自保存。","internal":"优先保留页面 Markdown → 按需启动排版 Agent → 检查链接和引用 → 保存呈现版本。"},{"id":"structure","title":"结构化 Agent","template":"text","status":"approved-design","kind":"capability","label":"structure_content","task":"按指定的预设字段，从捕获内容中提取正文结构或引用关联。每个字段关联来源 captureId，缺失字段返回空值。","inputs":[{"key":"captures","label":"捕获内容","value":"本次指定 captureId 对应的文本与已观察链接"},{"key":"preset","label":"预设字段","value":"reading-material.v1 或 reply-citations.v1"}],"tools":[],"skills":[],"skillNote":"空列表；字段与证据要求由预设契约提供。","output":"JSON fields + captureId evidence","trigger":"已捕获内容需要语义字段提取或引用对应时调用；代码负责确定的 URL 读取与规范化。","example":{"captures":[{"captureId":"capture-01","text":"Article title · Example author","links":["https://example.org/post"]}],"preset":"reply-citations.v1"},"policy":"模型使用提供的捕获内容。应用校验字段出处和链接集合。","internal":"读取指定捕获 → 调用结构化 Agent → 字段与来源校验 → 保存结构化结果。"},{"id":"introduce","title":"导读 Agent","template":"text","status":"approved-design","kind":"capability","label":"introduce_content","task":"为这一篇材料写一段简短导读，交代主题、主要内容和一个具体细节，按材料的实际覆盖范围归因。","inputs":[{"key":"title","label":"材料标题","value":"这篇材料的已保存标题"},{"key":"markdown","label":"可读正文","value":"当前已完成的阅读内容"},{"key":"coverage","label":"覆盖范围","value":"完整、部分或未知，以及已观察的原因"},{"key":"targetLanguage","label":"阅读语言","value":"本次阅读任务保存的语言"}],"tools":[],"skills":[],"skillNote":"空列表；单篇导读任务提供长度和归因要求。","output":"one short material introduction","trigger":"阅读管线为一个材料生成导读；长材料按预算分段后沿用该配置处理。","example":{"title":"Using AI for long articles","markdown":"The author describes a reading workflow and checks every cited source.","coverage":"complete","targetLanguage":"zh-CN"},"policy":"导读面向单篇材料；用户的收集动作决定进入阅读管线的来源。","internal":"读取材料与覆盖范围 → 调用导读 Agent → 保存该材料的介绍。"}],"routes":{"advisor":{"title":"顾问回答：应用按规则调用，Agent 专注网页","summary":"每个话题按目标语言共享提问准备，回复通过一次调用生成阅读版本。桥梁 Agent 通过工具入口整理已捕获的引用字段。","active":["question","bridge","reading-version","structure"],"steps":[["应用准备提问","translate_question 按话题和目标语言保存成功或失败结果 → 各专家拼接来源增强提示 → 保存实际发送文本。"],["桥梁 Agent 取得回答","browser + 当前平台 Skill；Main 先保存原始回答。"],["通过工具整理引用","捕获来源面板 → structure_content → 保存来源关联。"],["应用呈现并发布","prepare_reading 一次完成回复翻译与排版，保留原始回答；各成员结束后，由 Main 生成本次 result.md。"]]},"reading":{"title":"链接阅读：同一组能力服务处理材料","summary":"手动链接、机器人链接和话题中选中的来源，都由阅读管线直接复用内容能力。","active":["capture","translate","structure","introduce"],"steps":[["应用派发采集","一个来源地址、采集范围和阅读 Skill 索引。"],["采集 Agent 交付来源","加载对应阅读 Skill → 按范围调用工具和浏览器 → 返回捕获 ID。Main 校验并保存材料快照。"],["应用处理正文","translate_content 按 Markdown 块翻译，保留已完成分块；恢复时按保存的阅读语言处理剩余分块。"],["应用生成导读并发布","introduce_content 处理单篇材料；运行结束后，Main 生成 result.md。"]]},"tool":{"title":"一次工具调用：主上下文只接收结果引用","summary":"以桥梁 Agent 调用 structure_content 为例，工具内部创建独立短上下文，并由应用保存处理结果。","active":["bridge","structure"],"steps":[["Agent 调用工具","structure_content({ sourceRef, preset })。"],["工具准备输入","应用读取捕获记录，给内部 Agent 本次内容与字段契约。"],["内部 Agent 返回","输出字段与捕获证据，应用完成来源校验和保存。"],["工具返回结果 ID","{ operationId, artifactRef, state, issue? }；调用方继续当前任务。"]]}},"grounding":{"zh-CN":"请基于本平台的相关帖子回答，并附原帖链接。","en":"Answer using relevant posts on this platform and include links to the original posts."},"skillLoading":{"catalog":"An allowlisted index of Skill name and description.","selection":"Both browser profiles select and call load_platform_skill.","staticPlatformEntry":"Defined inside the selected platform Skill body."},"resultPublication":{"owner":"Main deterministic renderer","input":"Saved, validated state and content artifacts","output":"\u003cprofile>/results/\u003ckind>/\u003crunId>/result.md","newAgent":false},"roleBinding":{"owner":"Main","identity":["adapterId","queryLanguage"],"skill":"Shared per actual platform-AI adapter, selected and loaded by the browser Agent.","contextBoundary":"Role, connection and reading snapshots stay in caller context; submittedPrompt and skillCatalog remain the bridge startup input.","configuration":"Main resolves each expert from an independent content-platform/AI route and its enabled query languages; routes can reference one shared AI connection."}},"results":{"schemaVersion":"postrove.run-result.v1","writer":"Main deterministic renderer","kinds":["search","reading"],"profileRoot":"Resolved runtime profile; existing storage identity is retained.","runPath":"\u003cprofile>/results/\u003ckind>/\u003crunId>/result.md","latestPath":"\u003cprofile>/results/\u003ckind>/latest.md","manifestPath":"\u003cprofile>/results/\u003ckind>/\u003crunId>/manifest.json","terminalStates":["completed","partial","failed","stopped"],"runResult":{"mutableAfterPublication":false,"publishWhen":"All selected advisor sections or reading materials have reached a terminal outcome.","contents":"Question or submitted URL, exact platform prompts, languages, attributed answers or material bodies, verified sources, coverage, stage issues and provenance.","fallback":"Available original content remains in result.md when translation or formatting fails. Each section carries its own observed state.","roleProvenance":"Search sections preserve roleId, adapterId, sourcePlatform, aiProduct, queryLanguage, sourceLanguage and readingLanguage snapshots."},"latest":{"format":"complete Markdown content","meaning":"Latest admitted run of this kind among terminal, published runs.","selection":"Compare persisted admission sequence; an older run that ends later preserves the newer selection.","linkPolicy":"Render local links relative to the latest file and include the canonical absolute run path.","activeRun":"Continue serving the previous terminal publication while a newer run is active.","terminalFailure":"Publish the input, error stage and available saved content, including an explicitly empty result when capture failed."},"retry":{"identity":"new runId with retryOf","scope":"Retry after publication creates a new run package. Automatic recovery before terminal state uses the current runId and separate attemptId."},"publication":{"steps":["Read committed state and saved content.","Render result.md, input.json, manifest.json and source files in a temporary sibling directory.","Atomically rename the complete run directory and persist its absolute resultPath.","Atomically replace the eligible latest.md with full Markdown; reconcile latest from published manifests on startup."],"onFailure":"Keep business results readable in the app, record publication failure and retry rendering from the same saved inputs. Publish the run directory once; latest replacement can retry independently.","author":"Fixed code templates preserve per-advisor attribution and material boundaries."},"manifestFields":["schemaVersion","kind","runId","retryOf?","admissionSequence","state","createdAt","finishedAt","readingLanguage","resultPath","sections[]","files[]","roleSnapshots[]"],"files":[{"path":"\u003ckind>/\u003crunId>/input.json","role":"Original input, exact submitted questions, selected members, frozen language and prompt versions.","updates":"Written with the final run package."},{"path":"\u003ckind>/\u003crunId>/result.md","role":"Complete readable entry for a person or another AI.","updates":"Fixed after publication."},{"path":"\u003ckind>/\u003crunId>/manifest.json","role":"Run identity, states, provenance and local file list.","updates":"Fixed after publication."},{"path":"\u003ckind>/\u003crunId>/sources/*.md","role":"Captured original text or page Markdown, grouped by advisor or material.","updates":"Fixed copies with original capture references."},{"path":"\u003ckind>/\u003crunId>/assets/*","role":"Local copies of material images referenced by this run.","updates":"Fixed copies; result Markdown uses relative paths."},{"path":"\u003ckind>/latest.md","role":"Latest terminal publication with full content and canonical run path.","updates":"Atomically replaced after an eligible publication."},{"path":"reading/\u003cattemptId>/evidence/youtube/\u003cvideoId>/*","role":"Raw caption track, metadata, timed segments, and backend provenance.","updates":"Fixed with each published reading attempt."}],"otherPersistence":[{"scope":"Application d     `<ul class="detail-list">${items.map((item) => `<li>${escape(item)}</li>`).join("")}</ul>`;

  function render(target) {
    if (target.kind === "profile") return profileView(target.id);
    if (target.kind === "tool") return toolView(target.id);
    if (target.kind === "skill") return skillView(target.id);
    if (target.kind === "catalog") return catalogView();
    if (target.kind === "content") return contentView();
    if (target.kind === "policy") return policyView();
    return nodeView(target.id);
  }

  function navigate(target, push = true, source) {
    if (dialog.open && push && current) history.push(current);
    if (!dialog.open) {
      history = [];
      trigger = source;
      trigger?.focus();
    }
    current = target;
    const view = render(target);
    heading.textContent = view.title;
    eyebrow.textContent = view.kicker;
    body.innerHTML = view.html;
    body.scrollTop = 0;
    back.hidden = history.length === 0;
    document
      .querySelectorAll(".system-diagram [data-inspect]")
      .forEach((el) => {
        const active =
          el.dataset.inspect === target.kind && el.dataset.id === target.id;
        el.classList.toggle("is-selected", active);
        el.setAttribute("aria-expanded", String(active));
      });
    document.body.classList.add("detail-open");
    if (!dialog.open) dialog.showModal();
    dialog.querySelector(".detail-close").focus();
  }

  document.addEventListener("click", (event) => {
    const target = event.target.closest("[data-inspect]");
    if (target)
      navigate(
        { kind: target.dataset.inspect, id: target.dataset.id },
        true,
        target,
      );
  });
  document
    .querySelector(".system-diagram")
    .addEventListener("keydown", (event) => {
      const target = event.target.closest("[data-inspect]");
      if (target && ["Enter", " "].includes(event.key)) {
        event.preventDefault();
        target.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      }
    });
  document
    .getElementById("detail-close")
    .addEventListener("click", () => dialog.close());
  back.addEventListener("click", () => {
    const previous = history.pop();
    if (previous) navigate(previous, false);
  });
  dialog.addEventListener("click", (event) => {
    if (event.target !== dialog) return;
    const r = dialog.getBoundingClientRect();
    if (
      event.clientX < r.left ||
      event.clientX > r.right ||
      event.clientY < r.top ||
      event.clientY > r.bottom
    )
      dialog.close();
  });
  dialog.addEventListener("close", () => {
    document.body.classList.remove("detail-open");
    document
      .querySelectorAll(".system-diagram [data-inspect]")
      .forEach((el) => {
        el.classList.remove("is-selected");
        el.setAttribute("aria-expanded", "false");
      });
    trigger?.focus();
    history = [];
    current = undefined;
  });
  body.addEventListener("change", (event) => {
    if (!["bridge-example", "capture-example"].includes(event.target.id))
      return;
    const id = event.target.id;
    if (id === "bridge-example") bridgeRole = event.target.value;
    else captureExample = event.target.value;
    const view = profileView(id === "bridge-example" ? "bridge" : "capture");
    body.innerHTML = view.html;
    document.getElementById(id).focus();
  });
  body.addEventListener("click", async (event) => {
    const copy = event.target.closest(".copy-packet");
    if (!copy) return;
    const status = body.querySelector(".copy-status");
    try {
      await navigator.clipboard.writeText(
        JSON.stringify(startupPacket, null, 2),
      );
      status.textContent = "已复制";
    } catch {
      status.textContent = "复制失败，请选择下方文本复制。";
    }
  });

  const download = document.getElementById("download-html");
  let htmlUrl;
  function prepareDownload() {
    if (htmlUrl) URL.revokeObjectURL(htmlUrl);
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector("#detail-sheet").removeAttribute("open");
    clone.querySelector("#detail-body").innerHTML = "";
    clone.querySelector("body").classList.remove("detail-open");
    clone
      .querySelectorAll(".is-selected")
      .forEach((el) => el.classList.remove("is-selected"));
    clone
      .querySelectorAll('[aria-expanded="true"]')
      .forEach((el) => el.setAttribute("aria-expanded", "false"));
    htmlUrl = URL.createObjectURL(
      new Blob(["<!doctype html>\n" + clone.outerHTML], {
        type: "text/html;charset=utf-8",
      }),
    );
    download.href = htmlUrl;
  }
  download.addEventListener("click", prepareDownload);
  prepareDownload();
})();
</script></body></html>
